[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "udb-inspector"
version = "0.2.2"
description = "Terminal database inspector: browse schemas, run queries, export CSV/Excel."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Handara" }]
keywords = ["database", "sql", "tui", "inspector", "postgresql", "mysql", "sqlite", "oracle", "duckdb"]
dependencies = [
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "sqlglot>=25",
    "textual>=1.0",
    "tomlkit>=0.12",
    "tree-sitter-sql>=0.3",
    "tree-sitter>=0.23",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
mssql = ["pyodbc>=5.0"]
oracle = ["oracledb>=2.0"]
duckdb = ["duckdb-engine>=0.13", "pytz"]  # DuckDB returns times with a zone through pytz
all = ["udb-inspector[postgres,mysql,mssql,oracle,duckdb]"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Handara/udb-inspector"
Issues = "https://github.com/Handara/udb-inspector/issues"

[project.scripts]
udbi = "udb_inspector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/udb_inspector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
